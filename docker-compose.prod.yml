services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: backend-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      PORT: "3000"
      COOKIE_SECURE: "true"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: frontend-prod
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - backend

  certbot:
    build:
      context: ./docker/certbot
    container_name: certbot-prod
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - certbot-etc:/etc/letsencrypt
      - ./docker/certbot/secrets:/etc/letsencrypt/secrets:ro

volumes:
  pgdata_prod:
  certbot-etc:
